<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print the Boxes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root { --bg: #F6F1E6; --panel: #EDE3D0; --fg: #23211D; --muted: #6B655A; --line: #CFC3AC; --blue: #1F6FD6;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1A1C1F; --panel: #24272B; --fg: #ECE6DA; --muted: #A39C8E; --line: #3A3E44; --blue: #5E9BF0; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #1A1C1F; --panel: #24272B; --fg: #ECE6DA; --muted: #A39C8E; --line: #3A3E44; --blue: #5E9BF0; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 17px/1.6 var(--f-body); margin: 0; }
main { max-width: 820px; margin: 0 auto; padding: 28px 16px 64px; }
a { color: var(--blue); }
h1, h2 { font-family: var(--f-display); line-height: 1.15; }
h1 { font-size: clamp(2.2rem, 6vw, 3.2rem); margin: 0.4em 0 0.3em; }
h2 { font-size: 1.6rem; margin-top: 1.8em; }
nav a, footer a { font: 700 1rem var(--f-display); text-decoration: none; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-family: var(--f-mono); font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
td:first-child { font-family: var(--f-display); font-weight: 700; }
.mw-panel { margin: 0 !important; }
footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<main>
<nav><a href="index.html">← All boxes</a></nav>
<h1>Print the boxes</h1>
<p>Every box and every kit will have its print files on MakerWorld, ready for the slicer with the colors already set. The ones still marked "coming soon" are on their way.</p>
<p id="profile"></p>
<h2>Kits</h2>
<table><thead><tr><th>Kit</th><th>Print files</th></tr></thead><tbody id="kits"></tbody></table>
<h2>Boxes</h2>
<table><thead><tr><th>Box</th><th>Print files</th></tr></thead><tbody id="boxes"></tbody></table>
<footer><a href="index.html">← Back to all boxes</a></footer>
</main>
<script src="makerworld.js"></script>
<script>
(function () {
  var MW = window.MAKERWORLD || { boxes: {}, kits: {} };
  if (MW.profile) document.getElementById("profile").innerHTML =
    'All of them: <a href="' + encodeURI(MW.profile) + '" target="_blank" rel="noopener">the MakerWorld profile ↗</a>';
  function rows(group, kind, id) {
    var body = document.getElementById(id), keys = Object.keys(group || {});
    keys.sort();
    if (kind === "kit") keys = Object.keys(group);          // kits keep their order
    keys.forEach(function (k) {
      var e = group[k], tr = document.createElement("tr");
      var name = document.createElement("td"), cell = document.createElement("td");
      if (e.page) { var a = document.createElement("a"); a.href = e.page; a.textContent = e.name; name.appendChild(a); }
      else name.textContent = e.name;
      var slot = document.createElement("div"); slot.setAttribute("data-makerworld", kind + ":" + k);
      cell.appendChild(slot); tr.appendChild(name); tr.appendChild(cell); body.appendChild(tr);
    });
  }
  rows(MW.kits, "kit", "kits");
  rows(MW.boxes, "box", "boxes");
})();
</script>
<script src="mw.js"></script>
</body>
</html>
